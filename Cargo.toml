[workspace]
members = ["cli", "core", "integration_tests", "program", "sdk"]

resolver = "2"

[workspace.package]
version = "0.0.1"
authors = ["Jito Network Maintainers <support@jito.network>"]
repository = "https://github.com/jito-foundation/jito-bls-ncn"
homepage = "https://jito.network/"
license = "MIT OR Apache-2.0"
edition = "2021"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0.100"
ark-bn254 = "0.5.0"
ark-ec = "0.5.0"
ark-ff = "0.5.0"
ark-serialize = "0.5.0"
bn254 = { git = "https://github.com/BreadchainCoop/bn254.git" }
bytes = "1.10.1"
commonware-codec = "0.0.56"
commonware-cryptography = "0.0.56"
commonware-utils = "0.0.56"
hex = "0.4.3"
jito-bls-ncn-sdk = { path = "./sdk" }
jito-restaking-core = { package = "jito-restaking-core", git = "https://github.com/jito-foundation/restaking", branch = "master" }
jito-vault-core = { package = "jito-vault-core", git = "https://github.com/jito-foundation/restaking", branch = "master" }
serde_json = "1.0.145"
solana-account-info = "3.0.0"
solana-bn254 = "3.0.0"
solana-commitment-config = "3.0.0"
solana-instruction = "3.0.0"
solana-keypair = "3.0.0"
solana-msg = "3.0.0"
solana-program = { version = "3.0.0", default-features = false }
solana-program-entrypoint = "3.0.0"
solana-program-error = "3.0.0"
solana-program-test = "3.0.0"
solana-pubkey = "3.0.0"
solana-security-txt = "1.1.1"
solana-sha256-hasher = "3.0.0"
solana-signer = "3.0.0"
solana-system-interface = "2.0.0"
solana-system-transaction = "3.0.0"
solana-transaction = "3.0.0"
spl-associated-token-account-interface = "2.0.0"
# jito-bytemuck = { package = "jito-bytemuck", git = "https://github.com/jito-foundation/restaking", branch = "master" }
# bytemuck = { version = "1.16.3", features = ["derive", "min_const_generics"] }
spl-token-interface = "2.0.0"
